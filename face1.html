<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 隨音樂搖頭人物 (階段進度標籤版)</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #dbe4e8; 
            color: white; 
            font-family: sans-serif; 
        }
        
        /* === 全新設計的進度標籤 (不再是全螢幕遮罩) === */
        #progress-tag {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            color: #fff;
            z-index: 9999;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            transition: all 0.5s ease; /* 改變內容時有滑順感 */
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
        /* 當達到 100% 時，讓它變得不那麼顯眼 */
        #progress-tag.completed {
            background: rgba(40, 180, 99, 0.2);
            color: #27ae60;
            font-size: 12px;
            border: 1px solid rgba(40, 180, 99, 0.3);
            box-shadow: none;
        }

        #ui-layer { 
            position: absolute; top: 15px; left: 15px; z-index: 10; 
            opacity: 0; transition: opacity 1.5s ease; /* 緩慢浮現 UI */
        }
        
        .controls { 
            pointer-events: auto; background: rgba(40, 40, 40, 0.85); 
            padding: 15px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: inline-block; text-align: left; width: 320px;
        }

        .input-group, .color-settings { margin-bottom: 15px; font-size: 14px;}
        input[type="file"] { margin-top: 5px; width: 100%; color: white;}
        select, input[type="color"] { padding: 5px; cursor: pointer; border-radius: 4px; }
        audio { width: 100%; margin-top: 5px; outline: none; }
        button {
            padding: 8px 15px; margin-top: 10px; font-size: 14px;
            cursor: pointer; border: none; border-radius: 4px;
            background-color: #3498db; color: white; width: 100%;
        }
        button:hover { background-color: #2980b9; }
        #btnRecord { background-color: #e74c3c; font-weight: bold;}
        #btnStop { background-color: #95a5a6; display: none;}
        button:disabled { background-color: #555 !important; cursor: not-allowed; }

        #spectrumCanvas { display: block; margin-top: 15px; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; background-color: #111; width: 100%; height: 80px;}
        
        #hint { 
            position: absolute; bottom: 20px; width: 100%; text-align: center; 
            color: #666; pointer-events: none; font-size: 14px; 
            opacity: 0; transition: opacity 1.5s ease;
        }
    </style>
</head>
<body>

    <!-- 階段性進度標籤 (放在右下角) -->
    <div id="progress-tag">系統初始化... 15%</div>

    <!-- UI 控制面板 -->
    <div id="ui-layer">
        <div class="controls">
            <h3 style="text-align: center; margin: 0 0 15px 0;">🎵 3D 音樂動態搖頭人物</h3>
            <div class="input-group">
                <label>📂 選擇本機音樂檔案：</label><br>
                <input type="file" id="audioUpload" accept="audio/*">
            </div>
            <div class="color-settings">
                <label>🎨 頻譜顏色：</label>
                <select id="colorMode">
                    <option value="custom">自訂顏色</option>
                    <option value="rainbow">彩虹漸層</option>
                    <option value="classic">經典動態</option>
                </select>
                <input type="color" id="customColor" value="#00ffff">
            </div>
            <audio id="audioPlayer" controls></audio>
            <canvas id="spectrumCanvas" width="320" height="80"></canvas>
            <button id="btnRecord" disabled>🔴 開始錄製 3D 畫面</button>
            <button id="btnStop">⏹️ 停止並下載</button>
        </div>
    </div>

    <div id="hint">按住滑鼠左鍵可旋轉 3D 模型視角</div>

    <!-- 載入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // ==========================================
        // 手動進度控制器
        // ==========================================
        const progressTag = document.getElementById('progress-tag');
        
        function setProgress(percent, msg) {
            progressTag.innerText = `${msg} ${percent}%`;
            if (percent === 100) {
                progressTag.classList.add('completed');
            }
        }

        // 確保給瀏覽器喘息的函數 (Yield to main thread)
        const yieldToMain = () => new Promise(resolve => setTimeout(resolve, 50)); 

        // ==========================================
        // 1. 繪製精緻五官貼圖
        // ==========================================
        function createFaceTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 512; 
            const ctx = canvas.getContext('2d');
            const cx = 512, cy = 256;

            ctx.fillStyle = '#fff0e5'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            const faceShadow = ctx.createRadialGradient(cx, cy, 60, cx, cy, 220);
            faceShadow.addColorStop(0, 'rgba(235, 190, 175, 0)');
            faceShadow.addColorStop(1, 'rgba(220, 150, 135, 0.4)');
            ctx.fillStyle = faceShadow; ctx.fillRect(0, 0, canvas.width, canvas.height);

            function drawBlush(x, y) {
                const blush = ctx.createRadialGradient(x, y, 0, x, y, 50);
                blush.addColorStop(0, 'rgba(255, 130, 140, 0.4)'); blush.addColorStop(1, 'rgba(255, 130, 140, 0)');
                ctx.fillStyle = blush; ctx.beginPath(); ctx.arc(x, y, 50, 0, Math.PI * 2); ctx.fill();
            }
            drawBlush(cx - 85, cy + 35); drawBlush(cx + 85, cy + 35);

            function drawEye(x, y, isLeft) {
                ctx.save();
                ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(x - 35, y); ctx.quadraticCurveTo(x, y - 30, x + 35, y); ctx.quadraticCurveTo(x, y + 16, x - 35, y); ctx.fill();
                ctx.save(); ctx.clip(); 
                
                const irisGrad = ctx.createRadialGradient(x, y, 2, x, y, 19);
                irisGrad.addColorStop(0, '#664433'); irisGrad.addColorStop(0.7, '#331a10'); irisGrad.addColorStop(1, '#110502');
                ctx.fillStyle = irisGrad; ctx.beginPath(); ctx.arc(x, y, 19, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#050201'; ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.fill();
                
                ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(x - 6, y - 6, 5, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(x + 7, y + 6, 2.5, 0, Math.PI * 2); ctx.fill();   
                ctx.restore(); 
                
                ctx.strokeStyle = '#d5a595'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x - 30, y - 19); ctx.quadraticCurveTo(x, y - 34, x + 30, y - 19); ctx.stroke();
                ctx.strokeStyle = '#2b1a15'; ctx.lineWidth = 4.5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x - 40, y + 2); ctx.quadraticCurveTo(x, y - 32, x + 42, y); ctx.stroke();
                
                ctx.strokeStyle = '#1a0d0a'; ctx.lineWidth = 2; ctx.lineCap = 'round';
                if (isLeft) {
                    ctx.beginPath(); ctx.moveTo(x - 20, y - 12); ctx.quadraticCurveTo(x - 30, y - 25, x - 35, y - 20); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(x - 30, y - 8); ctx.quadraticCurveTo(x - 45, y - 18, x - 53, y - 11); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(x - 38, y - 2);  ctx.quadraticCurveTo(x - 52, y - 8, x - 55, y + 2); ctx.stroke();
                } else {
                    ctx.beginPath(); ctx.moveTo(x + 20, y - 12); ctx.quadraticCurveTo(x + 30, y - 25, x + 35, y - 20); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(x + 30, y - 8); ctx.quadraticCurveTo(x + 45, y - 18, x + 53, y - 11); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(x + 38, y - 2);  ctx.quadraticCurveTo(x + 52, y - 8, x + 55, y + 2); ctx.stroke();
                }
                ctx.restore();
            }
            drawEye(cx - 70, cy - 10, true); drawEye(cx + 70, cy - 10, false);

            function drawEyebrow(x, y, isLeft) {
                ctx.strokeStyle = '#8a6552'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath();
                if(isLeft) { ctx.moveTo(x - 45, y); ctx.quadraticCurveTo(x, y - 8, x + 40, y - 2); } 
                else { ctx.moveTo(x - 40, y - 2); ctx.quadraticCurveTo(x, y - 8, x + 45, y); }
                ctx.stroke();
            }
            drawEyebrow(cx - 70, cy - 43, true); drawEyebrow(cx + 70, cy - 43, false);

            ctx.save();
            ctx.fillStyle = '#ff8888'; ctx.beginPath(); ctx.moveTo(cx - 35, cy + 70); ctx.quadraticCurveTo(cx, cy + 98, cx + 35, cy + 70); ctx.fill();
            ctx.fillStyle = '#f46666'; ctx.beginPath(); ctx.moveTo(cx - 38, cy + 68); ctx.quadraticCurveTo(cx - 15, cy + 58, cx, cy + 64); ctx.quadraticCurveTo(cx + 15, cy + 58, cx + 38, cy + 68); ctx.quadraticCurveTo(cx, cy + 85, cx - 38, cy + 68); ctx.fill();
            ctx.strokeStyle = '#b04a4a'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(cx - 38, cy + 68); ctx.quadraticCurveTo(cx, cy + 75, cx + 38, cy + 68); ctx.stroke();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)'; ctx.beginPath(); ctx.ellipse(cx - 12, cy + 78, 6, 2, 0.2, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(cx + 12, cy + 78, 6, 2, -0.2, 0, Math.PI*2); ctx.fill();
            ctx.restore();
            return canvas;
        }

        // ==========================================
        // 2. 髮型生成 (輕量版)
        // ==========================================
        function createHair() {
            const hairGroup = new THREE.Group();
            
            const colors = [0x7a4c33, 0x8a583c, 0x613721, 0x9c6545];
            const materials = colors.map(c => new THREE.MeshStandardMaterial({
                color: c, roughness: 0.45, metalness: 0.2, flatShading: true 
            }));

            const EYEBROW_Y = 0.15;
            const JAW_Y = -0.8;
            const LENGTH_SCALE = 0.333; 

            function addStrand(points, radius) {
                const curve = new THREE.CatmullRomCurve3(points);
                const tubeGeo = new THREE.TubeGeometry(curve, points.length - 1, radius, 3, false);
                const mat = materials[Math.floor(Math.random() * materials.length)];
                hairGroup.add(new THREE.Mesh(tubeGeo, mat));
            }

            // 短髮 (2000根)
            for (let i = 0; i < 2000; i++) {
                const R = 1.02 + Math.random() * 0.01; 
                let angle = Math.random() * 45;
                const phi = Math.random() * 0.4; 
                const startY = R * Math.cos(phi);
                const origTargetY = EYEBROW_Y - Math.random() * 0.1; 
                const targetY = startY - (startY - origTargetY) * (LENGTH_SCALE+0.333);
                
                const points = [];
                for (let j = 0; j <= 10; j++) {
                    const t = j / 10;
                    const currentY = startY - t * (startY - targetY);
                    const puff = Math.sin(t * Math.PI) * 0.04;
                    const currentR = Math.sqrt(Math.max(0, R * R - currentY * currentY)) + puff;
                    points.push(new THREE.Vector3(- (currentR * Math.sin(angle)), currentY, - (currentR * Math.cos(angle))));
                }
                addStrand(points, (0.004 + Math.random() * 0.002) * 0.25);
            }

            // 長髮 (2層 * 2400根 = 4800根)
            for(let layer = 0; layer < 2; layer++) {
                for (let i = 0; i < 2400; i++) {
                    const R = 1.02 + layer * 0.02 + Math.random() * 0.01; 
                    let angle = Math.random() * Math.PI * 2; 
                    if (angle > Math.PI) angle -= Math.PI * 2;
                    if (Math.abs(angle) < (Math.PI / 4)) continue; 

                    const phi = Math.pow(Math.random(), 1.5) * 1.5; 
                    const startY = R * Math.cos(phi);
                    const origTargetY = -1.2 - Math.random() * 1.0; 
                    const targetY = startY - (startY - origTargetY) * LENGTH_SCALE;
                    
                    const points = [];
                    const isFlying = Math.random() > 0.4; 
                    const flyRadius = (0.5 + Math.random() * 2.0) * LENGTH_SCALE; 
                    const flyRotAngle = (Math.PI / 360) * (0.1 + Math.random() * 0.1); 
                    const flyDir = angle >= 0 ? 1 : -1; 

                    for (let j = 0; j <= 15; j++) {
                        const t = j / 15;
                        let currentY = startY - t * (startY - targetY);
                        let currentR = (currentY > JAW_Y) ? Math.sqrt(Math.max(0, R * R - currentY * currentY)) : Math.sqrt(Math.max(0, R * R - JAW_Y * JAW_Y));
                        let finalR = currentR + Math.sin(t * Math.PI * 4 + phi) * 0.03;
                        let finalAngle = angle;

                        if (t > 0.4 && isFlying) {
                            const flyFactor = Math.pow((t - 0.4) / 0.6, 2); 
                            currentY += flyFactor * (0.5 + Math.random() * 0.2) * LENGTH_SCALE;
                            finalR += flyFactor * flyRadius;
                            finalAngle += flyFactor * flyRotAngle * flyDir;
                        }
                        points.push(new THREE.Vector3(- (finalR * Math.sin(finalAngle) + (Math.random()-0.5)*0.015), currentY, - (finalR * Math.cos(finalAngle) + (Math.random()-0.5)*0.015)));
                    }
                    addStrand(points, (0.006 + Math.random() * 0.003) * 0.125);
                }
            }
            return hairGroup;
        }

        // ==========================================
        // 3. 循序漸進的主程式 (核心精神)
        // ==========================================
        async function bootSequence() {
            // 【15%】剛進網頁時顯示
            setProgress(15, "系統初始化...");
            await yieldToMain();

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 0, 10); 

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); 
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.physicallyCorrectLights = true; 
            document.body.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enablePan = false; controls.minDistance = 5; controls.maxDistance = 25;
            controls.target.set(-1.8, 0.5, 0); 
            controls.minAzimuthAngle = -Math.PI / 3; controls.maxAzimuthAngle = Math.PI / 3;  
            controls.minPolarAngle = Math.PI / 2.8; controls.maxPolarAngle = Math.PI / 1.5; 

            const headGroup = new THREE.Group();
            headGroup.scale.set(0.70, 1.02, 0.80); 
            headGroup.position.set(-1.8, -1.0, 0);
            scene.add(headGroup);

            const hemiLight = new THREE.HemisphereLight(0xffffff, 0xbbbbbb, 1.5);
            hemiLight.position.set(0, 20, 0); scene.add(hemiLight);
            const sunLight = new THREE.DirectionalLight(0xffeedd, 2.2); 
            sunLight.position.set(5, 8, 3); scene.add(sunLight);

            // 建立五官與鼻子
            const faceTexture = new THREE.CanvasTexture(createFaceTexture());
            faceTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
            const face = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 64), new THREE.MeshStandardMaterial({ map: faceTexture, roughness: 0.6, metalness: 0.0 }));
            face.rotation.y = -Math.PI / 2; 

            const noseMesh = new THREE.Mesh(new THREE.SphereGeometry(0.11, 32, 32), new THREE.MeshStandardMaterial({ color: 0xfff0e5, roughness: 0.6, metalness: 0.0 }));
            noseMesh.scale.set(1.2, 1.8, 1.2); noseMesh.position.set(0, -0.08, 0.94); noseMesh.rotation.x = 0.52; 

            const nostrilMat = new THREE.MeshStandardMaterial({ color: 0x2b1712, roughness: 0.9 });
            const leftNostril = new THREE.Mesh(new THREE.SphereGeometry(0.025, 16, 16), nostrilMat);
            leftNostril.position.set(-0.045, -0.07, 0.05); leftNostril.scale.set(1.3, 0.5, 1.0); leftNostril.rotation.set(-0.2, 0, 0.25);
            const rightNostril = new THREE.Mesh(new THREE.SphereGeometry(0.025, 16, 16), nostrilMat);
            rightNostril.position.set(0.045, -0.07, 0.05); rightNostril.scale.set(1.3, 0.5, 1.0); rightNostril.rotation.set(-0.2, 0, -0.25);
            noseMesh.add(leftNostril); noseMesh.add(rightNostril);

            headGroup.add(face);
            headGroup.add(noseMesh);
            
            // 初始化音訊分析
            initAudioSystem();

            // 故意等一下下，讓瀏覽器有時間畫出模型底座
            await yieldToMain();
            
            // 【50%】五官與環境就緒，準備長頭髮
            setProgress(50, "建立環境與模型...");
            await yieldToMain();
            
            // 為了讓使用者有機會看到 "50%" 的字樣，故意等待一小段時間 (例如 0.8 秒)
            // 讓這 0.8 秒作為預期心理的緩衝
            await new Promise(resolve => setTimeout(resolve, 800));

            // 開始最耗時的頭髮運算 (此時畫面會卡住幾秒鐘是正常的，但因為已經提示 50%，使用者心理會有準備)
            const hair = createHair();
            hair.rotation.y = 180 * Math.PI / 180; 
            headGroup.add(hair);

            // 預先編譯著色器，防止第一次渲染白畫面
            renderer.compile(scene, camera);

            // 【100%】運算完畢！顯示 100% 並且浮現 UI
            setProgress(100, "3D 人物就緒");
            
            document.getElementById('ui-layer').style.opacity = '1';
            document.getElementById('hint').style.opacity = '1';

            startAnimationLoop(scene, camera, renderer, controls, headGroup);
        }

        // 啟動腳本
        setTimeout(bootSequence, 100);

        // ==========================================
        // 4. 音訊系統
        // ==========================================
        let audioContext, analyser, source, streamDestination;
        let dataArray, bufferLength;
        const audioUpload = document.getElementById('audioUpload');
        const audioPlayer = document.getElementById('audioPlayer');
        const colorMode = document.getElementById('colorMode');
        const customColor = document.getElementById('customColor');
        const specCanvas = document.getElementById('spectrumCanvas');
        const specCtx = specCanvas.getContext('2d');

        function hexToRgb(hex) {
            let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
            return { r, g, b };
        }

        function initAudioSystem() {
            audioUpload.addEventListener('change', function() {
                const file = this.files[0];
                if (!file) return;
                audioPlayer.src = URL.createObjectURL(file);
                document.getElementById('btnRecord').disabled = false;
            });

            audioPlayer.addEventListener('play', () => {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    source = audioContext.createMediaElementSource(audioPlayer);
                    streamDestination = audioContext.createMediaStreamDestination();
                    source.connect(analyser);
                    analyser.connect(audioContext.destination);
                    analyser.connect(streamDestination);
                    analyser.fftSize = 256; 
                    bufferLength = analyser.frequencyBinCount;
                    dataArray = new Uint8Array(bufferLength);
                }
                if (audioContext.state === 'suspended') audioContext.resume();
            });
            setupRecording(audioPlayer);
        }

        // ==========================================
        // 5. 動畫迴圈 (搖頭邏輯)
        // ==========================================
        let targetRot = new THREE.Vector3(0, 0, 0);
        let lastHitTime = 0, extremeX = 0, extremeY = 0;
        let baseSwayX = 0, baseSwayY = 0, idleUpdateTime = 0;
        const HIT_PEAK_MS = 120, HIT_RETURN_MS = 250; 

        function startAnimationLoop(scene, camera, renderer, controls, headGroup) {
            function animate() {
                requestAnimationFrame(animate);

                specCtx.fillStyle = 'rgba(17, 17, 17, 1)';
                specCtx.fillRect(0, 0, specCanvas.width, specCanvas.height);

                const now = Date.now();

                if (analyser && !audioPlayer.paused) {
                    analyser.getByteFrequencyData(dataArray);
                    
                    let bassSum = 0;
                    const barWidth = (specCanvas.width / bufferLength) * 2.5;
                    let x = 0;
                    const mode = colorMode.value;
                    const userRgb = hexToRgb(customColor.value);

                    for (let i = 0; i < bufferLength; i++) {
                        let barHeight = dataArray[i];
                        if (i < 5) bassSum += barHeight; 

                        const drawHeight = barHeight > 0 ? barHeight * 0.3 : 2; 
                        if (mode === 'custom') {
                            const alpha = 0.3 + (barHeight / 255) * 0.7;
                            specCtx.fillStyle = `rgba(${userRgb.r}, ${userRgb.g}, ${userRgb.b}, ${alpha})`;
                        } else if (mode === 'rainbow') {
                            specCtx.fillStyle = `hsl(${(i / bufferLength) * 360}, 100%, 60%)`;
                        } else {
                            specCtx.fillStyle = `rgb(${barHeight + 50}, 100, ${255 - (barHeight / 2)})`;
                        }
                        specCtx.fillRect(x, specCanvas.height - drawHeight, barWidth - 2, drawHeight);
                        x += barWidth;
                    }

                    const bassAvg = bassSum / 5; 
                    const timeSinceHit = now - lastHitTime;

                    if (bassAvg > 175 && timeSinceHit > (HIT_PEAK_MS + HIT_RETURN_MS)) { 
                        lastHitTime = now;
                        const pattern = Math.floor(Math.random() * 4);
                        switch (pattern) {
                            case 0: extremeX = Math.random() > 0.5 ? 0.7 : -0.4; extremeY = 0; break;
                            case 1: extremeX = 0; extremeY = Math.random() > 0.5 ? 0.9 : -0.9; break;
                            case 2: extremeX = -0.4; extremeY = -0.9; break;
                            case 3: extremeX = 0.7; extremeY = 0.9; break;
                        }
                    }

                    const currentHitProgress = now - lastHitTime;
                    let currentLerpSpeed = 0.05;

                    if (currentHitProgress < HIT_PEAK_MS) {
                        targetRot.x = extremeX; targetRot.y = extremeY; targetRot.z = 0;
                        currentLerpSpeed = 0.5; 
                    } else if (currentHitProgress < (HIT_PEAK_MS + HIT_RETURN_MS)) {
                        targetRot.set(0, 0, 0); currentLerpSpeed = 0.15; 
                    } else {
                        if (now > idleUpdateTime) {
                            baseSwayX = (Math.random() * 0.1) - 0.05; 
                            baseSwayY = (Math.random() * 0.1) - 0.05;
                            idleUpdateTime = now + 400 + Math.random() * 300;
                        }
                        targetRot.x = baseSwayX + Math.sin(now * 0.002) * 0.02;
                        targetRot.y = baseSwayY + Math.cos(now * 0.0015) * 0.02;
                        targetRot.z = Math.sin(now * 0.001) * 0.01;
                        currentLerpSpeed = 0.04; 
                    }

                    headGroup.rotation.x += (targetRot.x - headGroup.rotation.x) * currentLerpSpeed;
                    headGroup.rotation.y += (targetRot.y - headGroup.rotation.y) * currentLerpSpeed;
                    headGroup.rotation.z += (targetRot.z - headGroup.rotation.z) * currentLerpSpeed;

                } else {
                    headGroup.rotation.x += (0 - headGroup.rotation.x) * 0.05;
                    headGroup.rotation.y += (0 - headGroup.rotation.y) * 0.05;
                    headGroup.rotation.z += (0 - headGroup.rotation.z) * 0.05;
                }

                controls.update();
                renderer.render(scene, camera);
            }
            animate();
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // ==========================================
        // 6. 錄影功能
        // ==========================================
        let mediaRecorder;
        let recordedChunks = [];
        
        function setupRecording(audioPlayer) {
            const btnRecord = document.getElementById('btnRecord');
            const btnStop = document.getElementById('btnStop');

            btnRecord.onclick = () => {
                if (audioContext && audioContext.state === 'suspended') audioContext.resume();
                audioPlayer.play();
                recordedChunks = [];

                const canvasElement = document.querySelector('canvas:not(#spectrumCanvas)');
                const canvasStream = canvasElement.captureStream(30);
                const audioStream = streamDestination.stream;
                const combinedStream = new MediaStream([...canvasStream.getTracks(), ...audioStream.getTracks()]);

                mediaRecorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm' });
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
                
                mediaRecorder.onstop = () => {
                    const url = URL.createObjectURL(new Blob(recordedChunks, { type: 'video/webm' }));
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = '3D_head_bop.webm';
                    a.click();
                    setTimeout(() => URL.revokeObjectURL(url), 100);
                };

                mediaRecorder.start();
                btnRecord.style.display = 'none'; btnStop.style.display = 'block';
            };

            btnStop.onclick = () => {
                if (mediaRecorder && mediaRecorder.state !== "inactive") {
                    mediaRecorder.stop();
                    audioPlayer.pause(); audioPlayer.currentTime = 0; 
                    btnRecord.style.display = 'block'; btnStop.style.display = 'none';
                }
            };
        }
    </script>

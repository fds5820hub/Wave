<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>AI 音樂頻譜生成器 (顏色隨選版)</title>
    <style>
        body {
            background-color: #222;
            color: white;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        canvas {
            display: block;
            margin: 20px auto;
            border: 2px solid #fff;
            width: 800px;
            height: 400px;
        }
        .controls {
            margin-bottom: 20px;
            background: #333;
            padding: 15px;
            border-radius: 8px;
            display: inline-block;
            text-align: left;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .color-settings {
            background: #444;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        input[type="file"] { margin-top: 5px; }
        select, input[type="color"] {
            padding: 5px;
            cursor: pointer;
            border-radius: 4px;
        }
        button {
            padding: 8px 15px;
            margin: 0 5px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background-color: #3498db;
            color: white;
        }
        button:hover { background-color: #2980b9; }
        #btnRecord { background-color: #e74c3c; font-size: 16px; margin-top: 10px; }
        #btnStop { background-color: #95a5a6; font-size: 16px; margin-top: 10px; }
        #btnRecord:disabled, #btnStop:disabled { background-color: #555; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="controls">
        <h2 style="text-align: center; margin-top:0;">🎵 動態頻譜生成器</h2>
        
        <!-- 上傳檔案 -->
        <div class="input-group">
            <label>📂 選擇本機音樂檔案：</label><br>
            <input type="file" id="audioUpload" accept="audio/*">
        </div>

        <!-- 顏色選擇控制區 -->
        <div class="color-settings">
            <label>🎨 頻譜顏色：</label>
            <select id="colorMode">
                <option value="custom">自訂顏色 (推薦)</option>
                <option value="rainbow">彩虹漸層</option>
                <option value="classic">經典動態 (藍紫)</option>
            </select>
            <!-- 顏色挑選器 (預設為螢光藍) -->
            <input type="color" id="customColor" value="#00ffff">
        </div>

        <div style="text-align: center; margin-top: 15px;">
            <audio id="audioPlayer" controls></audio>
            <br>
            <button id="btnRecord" disabled>🔴 開始錄製綠幕</button>
            <button id="btnStop" disabled>⏹️ 停止並下載</button>
        </div>
    </div>

    <!-- 綠幕畫布 -->
    <canvas id="canvas" width="800" height="400"></canvas>

    <script>
const audioUpload = document.getElementById('audioUpload');
const audioPlayer = document.getElementById('audioPlayer');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const btnRecord = document.getElementById('btnRecord');
const btnStop = document.getElementById('btnStop');

// 顏色控制元素
const colorMode = document.getElementById('colorMode');
const customColor = document.getElementById('customColor');

let audioContext, analyser, source, streamDestination;
let mediaRecorder;
let recordedChunks = [];
let isVisualizerRunning = false; // 確保動畫迴圈不會重複執行

// 初始化綠幕
ctx.fillStyle = 'rgb(0, 255, 0)';
ctx.fillRect(0, 0, canvas.width, canvas.height);

// 當使用者上傳檔案時
audioUpload.addEventListener('change', function() {
    const file = this.files[0];
    if (!file) return;
    audioPlayer.src = URL.createObjectURL(file);
    btnRecord.disabled = false;
});

// 🌟 【修復重點】：監聽原生播放器的「播放」動作
audioPlayer.addEventListener('play', () => {
    setupAudio();
    // 確保瀏覽器沒有強制休眠音頻引擎
    if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume();
    }
});

function hexToRgb(hex) {
    let r = parseInt(hex.slice(1, 3), 16);
    let g = parseInt(hex.slice(3, 5), 16);
    let b = parseInt(hex.slice(5, 7), 16);
    return { r, g, b };
}

function setupAudio() {
    // 確保 AudioContext 只建立一次
    if (!audioContext) {
        // 兼容不同瀏覽器
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioContext();
        analyser = audioContext.createAnalyser();
        
        // 抓取音樂來源
        source = audioContext.createMediaElementSource(audioPlayer);
        streamDestination = audioContext.createMediaStreamDestination();
        
        // 連接線路：音源 -> 分析器 -> 喇叭 & 錄音輸出
        source.connect(analyser);
        analyser.connect(audioContext.destination);
        analyser.connect(streamDestination);

        analyser.fftSize = 256; 
    }
    
    // 確保動畫迴圈只啟動一次
    if (!isVisualizerRunning) {
        isVisualizerRunning = true;
        drawVisualizer();
    }
}

function drawVisualizer() {
    requestAnimationFrame(drawVisualizer);
    
    // 如果音樂沒在播，就不需要一直耗效能重繪，但為了綠幕穩定還是保留迴圈
    if (!analyser) return;

    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);
    analyser.getByteFrequencyData(dataArray);

    // 每幀洗掉上一張圖 (畫綠幕)
    ctx.fillStyle = 'rgb(0, 255, 0)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const barWidth = (canvas.width / bufferLength) * 2.5;
    let barHeight;
    let x = 0;

    const mode = colorMode.value;
    const userRgb = hexToRgb(customColor.value);

    for (let i = 0; i < bufferLength; i++) {
        barHeight = dataArray[i];
        
        // 只有在有聲音時才畫高，沒聲音時給一點點基礎高度(例如2px)比較好看
        const drawHeight = barHeight > 0 ? barHeight * 1.2 : 2; 

        if (mode === 'custom') {
            const alpha = 0.3 + (barHeight / 255) * 0.7;
            ctx.fillStyle = `rgba(${userRgb.r}, ${userRgb.g}, ${userRgb.b}, ${alpha})`;
        } 
        else if (mode === 'rainbow') {
            const hue = (i / bufferLength) * 360;
            ctx.fillStyle = `hsl(${hue}, 100%, 60%)`;
        } 
        else {
            ctx.fillStyle = `rgb(${barHeight + 50}, 100, ${255 - (barHeight / 2)})`;
        }

        ctx.fillRect(x, canvas.height - drawHeight, barWidth - 2, drawHeight);
        x += barWidth;
    }
}

// 錄影按鈕功能
btnRecord.onclick = () => {
    setupAudio();
    if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume();
    }
    
    audioPlayer.play();
    recordedChunks = [];

    const canvasStream = canvas.captureStream(30);
    const audioStream = streamDestination.stream;
    const combinedStream = new MediaStream([...canvasStream.getTracks(), ...audioStream.getTracks()]);

    mediaRecorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm' });
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
    
    mediaRecorder.onstop = () => {
        const url = URL.createObjectURL(new Blob(recordedChunks, { type: 'video/webm' }));
        const a = document.createElement('a');
        a.href = url;
        a.download = 'audio_visualizer.webm';
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 100);
    };

    mediaRecorder.start();
    btnRecord.disabled = true;
    btnStop.disabled = false;
    btnRecord.innerText = "🔴 錄製中...";
};

btnStop.onclick = () => {
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
        audioPlayer.pause();
        audioPlayer.currentTime = 0; 
        btnRecord.disabled = false;
        btnStop.disabled = true;
        btnRecord.innerText = "🔴 開始錄製綠幕";
    }
};

    </script>
</body>
</html>
